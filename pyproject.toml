[project]
name = "darwin-proxy"
version = "2.1.0"
description = "Semantic redaction for financial AI agents: strip identity, keep the signal, prove it with a signed certificate."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vladimir Edouard", email = "vlad@standardizeddata.com" }]
keywords = ["pii", "redaction", "k-anonymity", "finance", "compliance", "de-identification", "presidio", "pseudonymization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic", "faker", "gender-guesser",
    "presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "presidio-structured",
    "cryptography>=42", "chromadb>=1.0", "pandas>=2.0",
    "fastapi>=0.110", "uvicorn>=0.27",
]

[project.optional-dependencies]
formats = ["openpyxl", "pyarrow"]
sql = ["sqlalchemy"]
images = ["presidio-image-redactor"]
dev = ["pytest", "pytest-cov", "hypothesis", "openpyxl", "pyarrow", "sqlalchemy"]

[project.urls]
Homepage = "https://github.com/vje013/darwin-proxy"
Repository = "https://github.com/vje013/darwin-proxy"

[project.scripts]
proxy = "proxy.cli:main"

[tool.setuptools.packages.find]
include = ["proxy*"]

[tool.pytest.ini_options]
addopts = "--cov=proxy --cov-report=term-missing -q"
testpaths = ["tests"]
markers = [
    "perf: real timing measurements; run outside coverage so baselines stay stable",
]

[tool.coverage.run]
omit = ["proxy/cli.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

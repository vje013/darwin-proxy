[project]
name = "darwin-proxy"
version = "0.1.0"
description = "Semantic redaction: strip identity, keep signal, prove it."
requires-python = ">=3.10"
dependencies = ["pydantic", "faker", "gender-guesser", "presidio-analyzer>=2.2"]

[project.scripts]
proxy = "proxy.cli:main"

[tool.setuptools]
packages = ["proxy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
